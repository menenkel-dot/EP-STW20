<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kinderhaus St. Wolfgang Elternportal</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    
    <!-- Favicon -->
    <link rel="icon" href="/logo.png" type="image/png" />
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Elternportal für das Kinderhaus St. Wolfgang - Neuigkeiten, Veranstaltungen und Kommunikation">
    <meta name="theme-color" content="#0891b2">
    
    <!-- iOS Specific -->
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Elternportal">
    
    <!-- Android Specific -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <script>
      // Anti-flicker script to apply theme before page renders
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    
    <!-- Tailwind CSS Konfiguration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#0891b2',
            }
          }
        }
      }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nunito', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
